name: Asteroid Simulation

on:
  pull_request:
    paths:
      - 'packages/asteroid-simulation/**'
      - '.github/workflows/asteroid-simulation.yml'
  push:
    branches:
      - feat/asteroid-simulation
    paths:
      - 'packages/asteroid-simulation/**'
      - '.github/workflows/asteroid-simulation.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build required Remotion packages
        run: |
          bunx turbo run make --filter='remotion' --filter='@remotion/three' --filter='@remotion/cli'

      - name: Lint asteroid simulation
        working-directory: packages/asteroid-simulation
        run: bun run lint

      - name: Bundle asteroid simulation
        working-directory: packages/asteroid-simulation
        run: bun run build
